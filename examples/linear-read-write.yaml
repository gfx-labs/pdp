# Explicit app-actor client-credentials flow. This is not an existing user install.
version: pdp.config/v1
revision: linear-read-write-v1
transport:
  unix_socket: /run/pdp/pdp.sock
  socket_mode: "0600"
identities:
  "1000": local-worker
schemas:
  linear:
    protocol: graphql
    file: ../internal/schema/testdata/linear.graphql
routes:
  - provider: linear
    binding: linear-app
    schema: linear
    scopes: [read, comments:create]
credentials:
  providers:
    linear:
      script: |
        def acquire(request):
            return linear_client_credentials("token", parameter("client_id"), secret("client_secret"))
      endpoints:
        token: https://api.linear.app/oauth/token
  bindings:
    linear-app:
      provider: linear
      linear_actor: app
      parameters:
        client_id: REPLACE_CLIENT_ID
      secrets:
        client_secret:
          file: /run/secrets/linear-client-secret
      scopes: [read, comments:create]
policy:
  grants:
    - id: approved-issues-read-comment
      mode: read_write
      scope:
        identities: [local-worker]
        providers: [linear]
        bindings: [linear-app]
      constraints:
        issues: [APPROVED_ISSUE_UUID]
