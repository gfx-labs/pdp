version: pdp.config/v1
revision: systemd-v1
transport:
  unix_socket: /run/pdp/pdp.sock
  socket_mode: "0660"
identities:
  "1000": local-worker
routes:
  - provider: github
    binding: github-local
credentials:
  providers:
    github:
      script: |
        def acquire(request):
            return static(secret("token"))
  bindings:
    github-local:
      provider: github
      secrets:
        token:
          systemd_credential: github-token
# Policy data evaluated by pkg/policy/base.rego; see examples/policy.md.
policy:
  grants:
    - id: local-github-full
      mode: full
      scope:
        identities: [local-worker]
        providers: [github]
        bindings: [github-local]
