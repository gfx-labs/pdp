# Read/write grant data plus an overriding custom Rego comment freeze.
# Replace all administrator IDs and repository names before serving.
version: pdp.config/v1
revision: github-comment-freeze-v1
transport:
  unix_socket: /run/pdp/pdp.sock
  socket_mode: "0600"
identities:
  "1000": local-worker
schemas:
  github:
    protocol: rest
    file: ../pkg/schema/testdata/github-rest.json
routes:
  - provider: github
    binding: github-app-repo
    schema: github
credentials:
  providers:
    github:
      script: |
        def acquire(request):
            return github_installation("token", secret("private_key"))
      endpoints:
        token: https://api.github.com/app/installations/REPLACE_INSTALLATION_ID/access_tokens
  bindings:
    github-app-repo:
      provider: github
      secrets:
        private_key:
          file: /run/secrets/github-app.pem
      github:
        app_id: REPLACE_APP_ID
        repository_ids: [123456789]
        permissions:
          contents: read
          issues: write
# Policy data evaluated by pkg/policy/base.rego; see examples/policy.md.
policy:
  grants:
    - id: approved-repository-read-comment
      mode: read_write
      scope:
        identities: [local-worker]
        providers: [github]
        bindings: [github-app-repo]
      constraints:
        repositories: [APPROVED_OWNER/APPROVED_REPOSITORY]
  custom_modules:
    comment-freeze.rego: |
      package pdp.custom

      import rego.v1

      deny contains "GitHub comments are temporarily frozen" if {
          input.provider == "github"
          some operation in input.operations
          operation.id == "issues/create-comment"
      }
