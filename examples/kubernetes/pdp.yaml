version: pdp.config/v1
revision: kubernetes-spiffe-v1
transport:
  spiffe:
    address: :8443
    workload_api: unix:///run/spire/sockets/agent.sock
    principals:
      spiffe://example.org/workers/approved: approved-worker
routes:
  - provider: github
    binding: github-worker
credentials:
  providers:
    github:
      script: |
        def acquire(request):
            return static(secret("token"))
  bindings:
    github-worker:
      provider: github
      secrets:
        token:
          file: /run/secrets/github-token
# Policy data evaluated by pkg/policy/base.rego; see examples/policy.md.
policy:
  grants:
    - id: approved-github-full
      mode: full
      scope:
        identities: [approved-worker]
        providers: [github]
        bindings: [github-worker]
