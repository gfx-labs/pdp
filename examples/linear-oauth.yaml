# Full gateway grant data for an existing Linear authorization-code installation.
# This is a rotating refresh flow, not the client_credentials automation grant.
# The original authorization must use actor=app and the exact scopes below.
# Replace UID and client ID. Provision the client secret outside this file.
# Provision state.json with refresh_token and the original granted scopes.
# Use directory mode 0700 and state-file mode 0600. Do not use a read-only mount
# for writable state. An uncertain refresh requires administrator reconciliation,
# not clearing recovery_required or retrying a historical refresh token.
version: pdp.config/v1
revision: linear-oauth-refresh-full-v1
transport:
  unix_socket: /run/pdp/pdp.sock
  socket_mode: "0600"
identities:
  "1000": local-worker
routes:
  - provider: linear
    binding: linear-installation
    scopes: [read, comments:create]
credentials:
  providers:
    linear:
      script: |
        def acquire(request):
            return linear_refresh("token", parameter("client_id"), secret("client_secret"))
      endpoints:
        token: https://api.linear.app/oauth/token
  bindings:
    linear-installation:
      provider: linear
      linear_actor: app
      parameters:
        client_id: REPLACE_CLIENT_ID
      secrets:
        client_secret:
          file: /run/secrets/linear-client-secret
      state_file: /var/lib/pdp/linear-oauth/state.json
      scopes: [read, comments:create]
# Policy data evaluated by pkg/policy/base.rego; see examples/policy.md.
policy:
  grants:
    - id: local-linear-installation-full
      mode: full
      scope:
        identities: [local-worker]
        providers: [linear]
        bindings: [linear-installation]
