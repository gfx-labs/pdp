# Full gateway policy, restricted GitHub App installation authority.
# Replace UID, app/installation IDs and numeric repository ID before serving.
# The mounted RSA PEM is read only after authorization, never by validate.
version: pdp.config/v1
revision: github-app-full-v1
transport:
  unix_socket: /run/pdp/pdp.sock
  socket_mode: "0600"
identities:
  "1000": local-worker
routes:
  - provider: github
    binding: github-app
credentials:
  providers:
    github:
      script: |
        def acquire(request):
            return github_installation("token", secret("private_key"))
      endpoints:
        token: https://api.github.com/app/installations/REPLACE_INSTALLATION_ID/access_tokens
  bindings:
    github-app:
      provider: github
      secrets:
        private_key:
          file: /run/secrets/github-app.pem
      github:
        app_id: REPLACE_APP_ID
        repository_ids: [123456789]
        permissions:
          contents: read
          issues: write
policy:
  grants:
    - id: local-github-app-full
      mode: full
      scope:
        identities: [local-worker]
        providers: [github]
        bindings: [github-app]
