name: image

# Builds ghcr.io/gfx-labs/pdp:<first 12 characters of the commit> and pushes it
# with this workflow's own token. No other credential can write the package.
# The log ends with the pushed reference and its digest.

on:
  push:
    branches: [main, p7-deploy]
  workflow_dispatch:

jobs:
  image:
    # A manual run from any other branch builds nothing.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/p7-deploy'
    runs-on: talos-metal-gfx
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: scripts/build-image --push
