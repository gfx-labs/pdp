name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: talos-metal-gfx-public
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd pkg internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Start disposable authenticated S3
        run: |
          docker run -d --name pdp-s3-test -p 127.0.0.1:18333:8333 \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.31@sha256:e14ad400e28c811fe8426dc08abf248ec722b9f017713290a9b84a54557f45c2 -ec '
            printf "%s" '\''{"identities":[{"name":"test","credentials":[{"accessKey":"P7SIGV4TEST","secretKey":"p7-sigv4-test-secret-only"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'\'' > /tmp/s3.json
            exec weed server -s3 -s3.port=8333 -s3.config=/tmp/s3.json -dir=/data'
          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18333/ || true)" = 403 ]; then exit 0; fi
            sleep 1
          done
          docker logs pdp-s3-test
          exit 1
      - name: Verify signatures and multipart against real S3
        env:
          PDP_TEST_S3_ENDPOINT: http://127.0.0.1:18333
          PDP_TEST_S3_ACCESS_KEY: P7SIGV4TEST
          PDP_TEST_S3_SECRET_KEY: p7-sigv4-test-secret-only
        run: go test -race ./pkg/gateway -run TestS3SigningIntegration -count=1 -v
      - if: always()
        run: docker rm -f pdp-s3-test || true
